; Пресеты экспорта. Ключи подписи (keystore) намеренно пустые: их место —
; в настройках редактора или переменных окружения CI, но не в репозитории.
;
; APK — для проверки на устройстве, AAB — для загрузки в Google Play.
; Пресет AAB требует один раз выполнить в редакторе
; «Проект → Установить шаблон сборки Android».

